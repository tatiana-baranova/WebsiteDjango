{% extends "layout.html" %}

{% block title%} {{ title }} {% endblock %}

{% block main %}
    <div class="form-section container">
        <h1>{{ title }}</h1>
        <form  method='POST'>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Реєстрація</button>
            <hr>
            <p>Зареєстровані? <a href="{% url 'user' %}">Вхід в особистий профіль</a> </p>
        </form>
    </div>
{% endblock %}
