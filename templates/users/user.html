{% extends "layout.html" %}

{% block title%} Сторінка авторизації {% endblock %}

{% block main %}
    <div class="form-section container">
        <h1 >Сторінка авторизації</h1>
        <form method='POST'>
            {% csrf_token %}
            {{ form}}
            <button type="submit">Вхід</button>
            <hr>
            <p><a href="{% url 'reg' %}">Реєстрація в особистий профіль</a> </p>
            <p>Забули пароль?<a href="{% url 'pass_reset' %}">Відновити пароль</a> </p>
        </form>
    </div>
{% endblock %}
