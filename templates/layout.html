<!doctype html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{{ title }}</title>
</head>
<body>
    <header class="container">
        <span class="logo">
            ByteSkill
        </span>
        <nav>
            <a href="{% url 'home' %}">Головна</a>
            <a href="{% url 'tariffs'%}">Тарифи</a>
            {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Профіль </a>
            <a href="{% url 'course-add' %}">Додати курс </a>
            <form action="{% url 'exit' %}" method="post">
                {% csrf_token %}
                <button class="btn" type="submit">Вихід</button>
            </form>
            {% else %}
            <a href="{% url 'user' %}">Вхід </a>
            <a href="{% url 'reg' %}">Реєстрація</a>
            {% endif%}
        </nav>
    </header>
    <main>
         {% block main %}
        {% endblock %}
    </main>


<footer>&copy; ByteSkill - Всі права захищенні</footer>
</body>
</html>
